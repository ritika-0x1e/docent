<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Summarizer</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="header">
      <!-- G2 (revised 2026-11-06): the tab's thread, shown only when there is one; no picker. -->
      <div class="thread-row" id="thread-row" hidden></div>
      <div class="title-row">
        <div class="tab-title" id="tab-title">—</div>
        <button type="button" id="reattach-thread" class="icon" hidden></button>
        <button type="button" id="settings-toggle" class="icon" aria-label="Settings" aria-expanded="false" title="Settings"></button>
      </div>
      <div class="status-row">
        <div class="status" id="status" role="status" aria-live="polite"></div>
        <button type="button" id="rescan" class="icon" hidden aria-label="Rescan" title="Rescan: read this page again and replace its saved data in the thread"></button>
        <button type="button" id="start-scan" class="primary">Start scan</button>
      </div>
      <!-- H3: cache-hit notice, styled apart from a finished scan. -->
      <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
      <div class="banner" id="banner" hidden></div>
      <div class="gen-row" id="gen-row" hidden></div>

      <form class="settings" id="settings" hidden>
        <label for="llm-provider">Headings &amp; summaries</label>
        <select id="llm-provider">
          <option value="gemini">Gemini Flash-Lite (local Ollama if Gemini fails)</option>
          <option value="ollama">Local Ollama only</option>
        </select>

        <label for="gemini-key">Gemini API key</label>
        <p class="muted small">Stored only in this browser.</p>
        <div class="field-row">
          <input type="password" id="gemini-key" autocomplete="off" spellcheck="false" placeholder="Paste key" />
          <button type="submit">Save</button>
          <button type="button" id="gemini-key-clear">Clear</button>
        </div>
        <p class="muted small" id="settings-status" role="status"></p>

        <label for="ollama-model">Ollama model</label>
        <p class="muted small">Leave empty to skip Ollama. Needs Ollama running on this computer (localhost:11434).</p>
        <div class="field-row">
          <input type="text" id="ollama-model" autocomplete="off" spellcheck="false" placeholder="a name from: ollama list" />
        </div>
      </form>
    </header>

    <main class="reading-view" id="reading-view"></main>

    <!-- Drag to share the height between sections and chat; double-click resets. -->
    <div class="splitter" id="splitter" role="separator" aria-orientation="horizontal" aria-label="Resize sections and chat" title="Drag to resize · double-click to reset" tabindex="0"></div>

    <!-- I3 (phase 6): chat over the tab's thread; replaced phase 4's find-sections box. -->
    <section class="chat-area" id="chat-area" aria-label="Chat">
      <div class="chat-head" id="chat-head" hidden>
        <span class="chat-title">Chat</span>
        <button type="button" id="chat-clear" class="text-button"></button>
      </div>
      <div class="chat-log" id="chat-log" aria-live="polite"></div>
      <form class="chat-form" id="chat-form">
        <textarea id="chat-input" rows="1" placeholder="Ask about this page…" disabled></textarea>
        <button type="button" id="chat-stop" class="icon" hidden></button>
        <button type="submit" id="chat-send" class="primary icon-only" disabled></button>
      </form>
      <p class="chat-hint muted small" id="chat-hint">Select text on the page to ask about just that part.</p>
    </section>

    <script src="../lib/threads.js"></script>
    <script src="icons.js"></script>
    <script src="../lib/panel-state.js"></script>
    <script src="render.js"></script>
    <script src="panel.js"></script>
  </body>
</html>
